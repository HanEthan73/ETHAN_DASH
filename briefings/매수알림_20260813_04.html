<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚨 자동매수 트리거 도달</title>
<style>
  :root{
    --bg:#0d1117;
    --card:#161b22;
    --border:#30363d;
    --text:#e6edf3;
    --sub:#8b949e;
    --red:#f85149;
    --green:#3fb950;
    --yellow:#d29922;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    padding:20px 14px 40px;
    max-width:640px;
    margin:0 auto;
  }
  h1{
    font-size:20px;
    color:var(--red);
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .timestamp{
    color:var(--sub);
    font-size:13px;
    margin-bottom:20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    margin-bottom:20px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }
  th{
    background:#1c2128;
    color:var(--sub);
    font-weight:600;
    text-align:left;
    padding:10px 8px;
    font-size:12px;
    letter-spacing:0.3px;
  }
  td{
    padding:12px 8px;
    border-top:1px solid var(--border);
  }
  .ticker{
    font-weight:700;
    color:var(--text);
  }
  .price{
    color:var(--red);
    font-weight:700;
  }
  .stop{color:var(--sub);}
  .target{color:var(--green);}
  .section-title{
    font-size:14px;
    color:var(--sub);
    margin:24px 0 8px;
    padding-left:2px;
  }
  .near-card{
    background:var(--card);
    border:1px solid var(--yellow);
    border-radius:12px;
    padding:14px;
    font-size:13px;
  }
  .near-row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid var(--border);
  }
  .near-row:last-child{border-bottom:none;}
  .footer{
    color:var(--sub);
    font-size:12px;
    margin-top:24px;
    text-align:center;
  }
  @media (max-width:480px){
    th,td{padding:8px 5px;font-size:12.5px;}
    h1{font-size:18px;}
  }
</style>
</head>
<body>
  <h1>🚨 자동매수 트리거 도달</h1>
  <div class="timestamp">2026-08-13 04:04 (KST 기준 스캔)</div>

  <div class="card">
    <table>
      <thead>
        <tr><th>종목</th><th>현재가</th><th>트리거가</th><th>손절</th><th>목표</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="ticker">AVGO</td>
          <td class="price">$417.92</td>
          <td>$420 이하</td>
          <td class="stop">$390</td>
          <td class="target">$480</td>
        </tr>
        <tr>
          <td class="ticker">INTC</td>
          <td class="price">$96.92</td>
          <td>$104.50 이하</td>
          <td class="stop">$95</td>
          <td class="target">$130</td>
        </tr>
        <tr>
          <td class="ticker">GOOGL</td>
          <td class="price">$339.32</td>
          <td>$385 이하</td>
          <td class="stop">$355</td>
          <td class="target">$450</td>
        </tr>
        <tr>
          <td class="ticker">TSM</td>
          <td class="price">$387.44</td>
          <td>$395 이하</td>
          <td class="stop">$355</td>
          <td class="target">$455</td>
        </tr>
        <tr>
          <td class="ticker">ORCL</td>
          <td class="price">$147.19</td>
          <td>$178 이하</td>
          <td class="stop">$162</td>
          <td class="target">$225</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="section-title">⚠️ 트리거 2% 이내 근접 종목</div>
  <div class="near-card">
    <div class="near-row">
      <span>ASTS</span>
      <span>$69.27 (트리거 $68, 1.9% 근접)</span>
    </div>
  </div>

  <div class="footer">MSFT / MRVL / AMZN / PLTR 는 트리거 미도달</div>
</body>
</html>
