<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자동매수 트리거 도달 알림</title>
<style>
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 20px;
  }
  h1 {
    font-size: 1.3rem;
    color: #ff6b6b;
    margin-bottom: 4px;
  }
  .timestamp {
    color: #8b949e;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 24px;
    background: #161b22;
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 10px 8px;
    text-align: center;
    font-size: 0.9rem;
    border-bottom: 1px solid #21262d;
  }
  th {
    background: #21262d;
    color: #58a6ff;
    font-weight: 600;
  }
  td.ticker {
    font-weight: 700;
    color: #f0f6fc;
  }
  td.price {
    color: #3fb950;
    font-weight: 600;
  }
  .section-title {
    font-size: 1rem;
    color: #d29922;
    margin: 20px 0 8px;
  }
  .near-table td.price {
    color: #d29922;
  }
  .footer {
    color: #6e7681;
    font-size: 0.75rem;
    margin-top: 20px;
    text-align: center;
  }
  @media (max-width: 480px) {
    th, td { font-size: 0.78rem; padding: 8px 4px; }
    h1 { font-size: 1.1rem; }
  }
</style>
</head>
<body>
  <h1>🚨 자동매수 트리거 도달</h1>
  <div class="timestamp">2026-08-07 00:05 (KST)</div>

  <table>
    <tr><th>종목</th><th>현재가</th><th>트리거가</th><th>손절</th><th>목표</th></tr>
    <tr><td class="ticker">INTC</td><td class="price">$102.01</td><td>$104.50</td><td>$95</td><td>$130</td></tr>
    <tr><td class="ticker">GOOGL</td><td class="price">$364.59</td><td>$385</td><td>$355</td><td>$450</td></tr>
    <tr><td class="ticker">ORCL</td><td class="price">$144.05</td><td>$178</td><td>$162</td><td>$225</td></tr>
  </table>

  <div class="section-title">⚠️ 2% 이내 근접 종목</div>
  <table class="near-table">
    <tr><th>종목</th><th>현재가</th><th>트리거가</th><th>차이</th></tr>
    <tr><td class="ticker">AVGO</td><td class="price">$424.85</td><td>$420</td><td>+1.15%</td></tr>
    <tr><td class="ticker">ASTS</td><td class="price">$68.12</td><td>$68</td><td>+0.18%</td></tr>
  </table>

  <div class="footer">자동매수 모니터링 · ETHAN</div>
</body>
</html>
