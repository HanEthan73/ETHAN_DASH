<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자동매수 트리거 알림</title>
<style>
  body {
    background-color: #121212;
    color: #e0e0e0;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 20px;
  }
  h1 {
    font-size: 1.3em;
    color: #ff5252;
    text-align: center;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 0.85em;
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background-color: #1e1e1e;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  th, td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid #333;
    font-size: 0.95em;
  }
  th {
    background-color: #2a2a2a;
    color: #ff8a80;
  }
  tr:last-child td {
    border-bottom: none;
  }
  .ticker {
    font-weight: bold;
    color: #ffffff;
  }
  .price {
    color: #ff5252;
    font-weight: bold;
  }
  @media (max-width: 480px) {
    table, th, td { font-size: 0.8em; }
    th, td { padding: 6px 4px; }
  }
</style>
</head>
<body>
  <h1>🚨 자동매수 트리거 도달</h1>
  <div class="subtitle">2026-10-01 04:10 (UTC)</div>
  <table>
    <tr>
      <th>종목</th>
      <th>현재가</th>
      <th>트리거가</th>
      <th>손절</th>
      <th>목표</th>
    </tr>
    <tr>
      <td class="ticker">AVGO</td>
      <td class="price">$355.10</td>
      <td>$420</td>
      <td>$390</td>
      <td>$480</td>
    </tr>
    <tr>
      <td class="ticker">GOOGL</td>
      <td class="price">$314.09</td>
      <td>$385</td>
      <td>$355</td>
      <td>$450</td>
    </tr>
    <tr>
      <td class="ticker">AMZN</td>
      <td class="price">$242.60</td>
      <td>$255</td>
      <td>$230</td>
      <td>$320</td>
    </tr>
    <tr>
      <td class="ticker">ASTS</td>
      <td class="price">$60.39</td>
      <td>$68</td>
      <td>$45</td>
      <td>$100</td>
    </tr>
  </table>
</body>
</html>
